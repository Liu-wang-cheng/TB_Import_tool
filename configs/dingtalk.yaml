# =============================================================================
# 钉钉机器人配置
# =============================================================================
# 说明：配置钉钉群机器人的 Webhook 地址，用于在同步完成后发送通知。
#       如不需要钉钉通知，将 enabled 设为 false 即可。
# =============================================================================

# 是否启用钉钉通知（强制开启，GUI 开关置灰不允许关闭）
enabled: true

# Webhook 地址
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 说明：在钉钉群 → 群设置 → 智能群助手 → 添加机器人 → 自定义机器人
#       创建后复制 Webhook 地址填入此处。
#       地址格式：https://oapi.dingtalk.com/robot/send?access_token=xxx
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=2202871e7d8d26af31b272bbeda2c4d77fbdb137df8634410f7c95fa33116a1f"

# 加签密钥（可选）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 说明：钉钉机器人安全设置中选择"加签"后生成的 SEC 开头的密钥。
#       用于计算签名，防止 Webhook 地址被恶意调用。
#       如果安全设置中未启用加签，此处可留空字符串。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
secret: SEC3735a54157aa80d6926a18c376acc04ad20934366ffbf6d5f90cd3c749b9f41f

# 推送时是否 @所有人
at_all: false

# HTTP 服务监听端口（指令触发模式用）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 说明：启动钉钉回调服务（dingtalk/server.py）时使用的端口号。
#       如不需要在钉钉群中@机器人触发同步，此项可忽略。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
callback_port: 8082
